<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Gunjan! 🎉</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for a lovely handwritten/editorial look -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Floating Background Canvas for Flowers & Confetti -->
    <canvas id="particleCanvas"></canvas>

    <!-- Music Control Banner -->
<!-- Background Music Player Widget -->
    <div class="music-banner">
        <div class="bg-player-card">
            <button id="musicToggle" class="bg-play-btn">🎵 Play your fav music</button>
            <div class="bg-slider-wrap">
                <input type="range" id="bgSlider" class="audio-slider" value="0" max="100" step="0.1">
                <div class="bg-time">
                    <span id="bgCurrent">0:00</span> / <span id="bgDuration">0:00</span>
                </div>
            </div>
        </div>
        <audio id="bgMusic" preload="metadata">
            <source src="assets/birthday_song.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="container">
        <header class="header">
            <h1>Happy Birthday best friend</h1>
        </header>

        <!-- Flipbook Container -->
        <div class="book-container">
            <button id="prevBtn" class="nav-btn" disabled><span>‹<br>Prev</span></button>
            
            <div class="book" id="book">
                <!-- Cover Page -->
                <div class="page cover-page active" data-page="0">
                    <div class="cover-content">
                        <div class="cover-emoji-row" aria-label="girly emojis">
                            <span>💄</span>
                            <span>💋</span>
                            <span>✨</span>
                            <span>💅</span>
                            <span>👗</span>
                            <span>🌸</span>
                            <span>🎵</span>
                            <span>🎶</span>
                            <span>🏙️</span>
                            <span>🍔</span>
                            <span>🎉</span>
                            <span>🥳</span>
                            <span>☀️</span>
                            <span>🌙</span>
                            <span>⭐</span>
                            <span>🎀</span>
                            <span>💃</span>
                            <span>🩷</span>
                            <span>🧴</span>
                            <span>🫧</span>
                        </div>
                        <div class="cover-name">Dearest Gunjan, </div>
                        <div class="cover-arrow">→</div>
                    </div>
                </div>

                <!-- Pages 1 to 10 will be dynamically generated by JavaScript -->
            </div>

            <button id="nextBtn" class="nav-btn"><span>Next<br>›</span></button>
        </div>
    </div>

    <script src="script.pages.js"></script>
</body>
</html>
